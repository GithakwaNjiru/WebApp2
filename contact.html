
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact Us</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<h1>Contact Us</h1>
		<nav>
			<a href="index.html">Home</a>
			<a href="about.html">About</a>
			<a href="services.html">Services</a>
			<a href="contact.html" aria-current="page">Contact</a>
		</nav>
	</header>
	<main>
		<section class="contact-info">
			<h2>Get in Touch</h2>
			<p>We'd love to hear from you! Fill out the form below or reach us using the contact details.</p>
			<ul>
				<li><strong>Email:</strong> <a href="mailto:info@example.com">info@example.com</a></li>
				<li><strong>Phone:</strong> <a href="tel:+1234567890">+1 (234) 567-890</a></li>
				<li><strong>Address:</strong> 123 Main St, City, Country</li>
			</ul>
		</section>
		<section class="contact-form-section">
			<h2>Contact Form</h2>
			<form class="contact-form" action="#" method="post" autocomplete="on">
				<label for="name">Name:</label>
				<input type="text" id="name" name="name" required>

				<label for="email">Email:</label>
				<input type="email" id="email" name="email" required>

				<label for="message">Message:</label>
				<textarea id="message" name="message" rows="5" required></textarea>

				<button type="submit">Send Message</button>
			</form>
		</section>
	</main>
	<footer>
		<p>&copy; 2026 BBit. All rights reserved.</p>
	</footer>
</body>
</html>
